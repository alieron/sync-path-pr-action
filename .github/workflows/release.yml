name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.2.3.
        required: true
      update-major-tag:
        description: Also move the major tag, for example v1.
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build action bundle
        run: npm run build

      - name: Create release tag
        env:
          TAG: ${{ inputs.tag }}
          UPDATE_MAJOR_TAG: ${{ inputs.update-major-tag }}
          CREATE_RELEASE: ${{ inputs.create-release }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


          git add -f dist
          git commit -m "Build action bundle for $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

          if [[ "$UPDATE_MAJOR_TAG" == "true" ]]; then
            MAJOR_TAG="${TAG%%.*}"
            git tag -fa "$MAJOR_TAG" -m "$MAJOR_TAG"
            git push --force origin "refs/tags/$MAJOR_TAG"
          fi
