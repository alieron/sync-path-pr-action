name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.2.3.
        required: true
      update-major-tag:
        description: Also move the major tag, for example v1.
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create release branch and tag
        env:
          TAG: ${{ inputs.tag }}
          UPDATE_MAJOR_TAG: ${{ inputs.update-major-tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format, for example v1.2.3."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          MAJOR_TAG="${TAG%%.*}"
          RELEASE_BRANCH="release/$MAJOR_TAG"

          git config user.email "${{ secrets.GIT_CONFIG_EMAIL }}"
          git config user.name "${{ secrets.GIT_CONFIG_NAME }}"

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            git switch --track -c "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git merge --no-ff --no-edit "$SOURCE_SHA"
          else
            git switch -c "$RELEASE_BRANCH" "$SOURCE_SHA"
          fi

          npm run build
          git add -f dist
          git commit -m "Build action bundle for $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/heads/$RELEASE_BRANCH"
          git push origin "refs/tags/$TAG"

          if [[ "$UPDATE_MAJOR_TAG" == "true" ]]; then
            git tag -fa "$MAJOR_TAG" -m "$MAJOR_TAG"
            git push --force origin "refs/tags/$MAJOR_TAG"
          fi
